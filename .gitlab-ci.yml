# ============================================================
# ShopSphere - Pipeline CI/CD DevSecOps
# Flux :
# Verify -> SAST -> Build -> Security -> DAST -> GitOps
# ============================================================

stages:
  - verify
  - sast
  - build
  - security
  - dast
  - gitops


# ============================================================
# 1. VERIFY
# Vérifie que le GitLab Runner Kubernetes fonctionne
# et que les fichiers principaux du projet sont présents.
# ============================================================

runner-smoke-test:
  stage: verify
  image: alpine:3.22
  tags:
    - kubernetes

  script:
    - echo "Runner Kubernetes ShopSphere opérationnel"
    - echo "Projet=$CI_PROJECT_PATH"
    - echo "Branche=$CI_COMMIT_BRANCH"
    - echo "Commit=$CI_COMMIT_SHORT_SHA"
    - uname -a
    - test -f README.md
    - test -f docker-compose.yml
    - find src -mindepth 1 -maxdepth 1 -type d | sort
    - echo "Validation initiale réussie"


# ============================================================
# 2. SAST - SEMGREP
# Analyse statique du code source avant la construction
# des images. Les erreurs détectées constituent un security gate.
# ============================================================

sast-semgrep:
  stage: sast
  image:
    name: semgrep/semgrep:latest
    entrypoint: [""]

  tags:
    - kubernetes

  script:
    - semgrep --version

    # Génération du rapport complet
    - semgrep scan --config p/default --json --output semgrep-report.json src

    # Security gate : échec si une erreur critique est détectée
    - semgrep scan --config p/default --severity ERROR --error src

  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week


# ============================================================
# 3. BUILD - KANIKO
# Construit les images des 9 microservices sans utiliser
# de Docker privilégié.
#
# Chaque image reçoit :
#   - un tag correspondant au SHA court du commit Git
#   - le tag latest
#
# Exemple :
# frontend:ddbed5bf
# ============================================================

build-images:
  stage: build

  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]

  tags:
    - kubernetes

  rules:
    - changes:
        - "src/**/*"
    - when: never

  parallel:
    matrix:
      - SERVICE:
          - accounting
          - cart
          - checkout
          - fraud-detection
          - frontend
          - frontend-proxy
          - payment
          - product-catalog
          - shipping

  script:
    - echo "Construction du microservice ${SERVICE}"

    # Authentification au Registry GitLab
    - mkdir -p /kaniko/.docker
    - AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json

    # Construction et push de l'image
    - >
      /kaniko/executor
      --cache=true
      --cache-ttl=24h
      --cache-repo "${CI_REGISTRY_IMAGE}/cache"
      --context "${CI_PROJECT_DIR}/src/${SERVICE}"
      --dockerfile "${CI_PROJECT_DIR}/src/${SERVICE}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/${SERVICE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/${SERVICE}:latest"
      --registry-certificate "${CI_REGISTRY}=${CI_SERVER_TLS_CA_FILE}"


# ============================================================
# 4. SECRET SCANNING - TRIVY
# Recherche les secrets accidentellement présents dans
# le dépôt : tokens, mots de passe, clés privées, etc.
#
# Ce contrôle agit comme un security gate :
# secret détecté -> pipeline en échec.
# ============================================================

secret-scan:
  stage: security

  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]

  tags:
    - kubernetes

  script:
    - trivy --version
    - echo "Recherche de secrets dans le dépôt ShopSphere"

    - >
      trivy fs
      --scanners secret
      --exit-code 1
      --format table
      --output trivy-secrets.txt
      .

    - cat trivy-secrets.txt

  artifacts:
    when: always
    paths:
      - trivy-secrets.txt
    expire_in: 1 week


# ============================================================
# 5. IMAGE SECURITY SCAN - TRIVY
# Analyse les images construites par Kaniko.
#
# Recherche les vulnérabilités HIGH et CRITICAL.
# Les vulnérabilités non corrigées sont ignorées.
# ============================================================

security-scan:
  stage: security

  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]

  tags:
    - kubernetes

  rules:
    - changes:
        - "src/**/*"
    - when: never

  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    SSL_CERT_FILE: "$CI_SERVER_TLS_CA_FILE"
    TRIVY_CACHE_DIR: ".trivycache"

  script:
    - trivy --version

    - |
      for SERVICE in \
        accounting \
        cart \
        checkout \
        fraud-detection \
        frontend \
        frontend-proxy \
        payment \
        product-catalog \
        shipping
      do
        echo "Analyse Trivy de ${SERVICE}:${CI_COMMIT_SHORT_SHA}"

        trivy image \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          --format table \
          --output "trivy-${SERVICE}.txt" \
          "${CI_REGISTRY_IMAGE}/${SERVICE}:${CI_COMMIT_SHORT_SHA}"

        cat "trivy-${SERVICE}.txt"
      done

  artifacts:
    when: always
    paths:
      - trivy-*.txt
    expire_in: 1 week


# ============================================================
# 6. DAST - OWASP ZAP
# Analyse dynamique de l'application déjà déployée.
#
# Job manuel afin d'éviter de générer automatiquement
# de la charge sur le laboratoire à chaque pipeline.
# ============================================================

dast-zap:
  stage: dast

  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]

  tags:
    - kubernetes

  variables:
    DAST_TARGET_URL: "https://shopsphere.ba3s.abrdns.com"

  script:
    - echo "Analyse DAST passive de ${DAST_TARGET_URL}"
    - mkdir -p /zap/wrk

    - |
      set +e

      zap-baseline.py \
        -t "${DAST_TARGET_URL}" \
        -m 1 \
        -I \
        -r zap-report.html \
        -J zap-report.json \
        -w zap-report.md

      ZAP_EXIT=$?
      set -e

      cp /zap/wrk/zap-report.html "${CI_PROJECT_DIR}/" 2>/dev/null || true
      cp /zap/wrk/zap-report.json "${CI_PROJECT_DIR}/" 2>/dev/null || true
      cp /zap/wrk/zap-report.md "${CI_PROJECT_DIR}/" 2>/dev/null || true

      if [ "${ZAP_EXIT}" -eq 3 ]; then
        echo "Échec technique du scan ZAP"
        exit 3
      fi

      echo "Scan DAST terminé avec le code ${ZAP_EXIT}"

  artifacts:
    when: always
    paths:
      - zap-report.html
      - zap-report.json
      - zap-report.md
    expire_in: 1 week

  allow_failure: true

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual


# ============================================================
# 7. GITOPS
# Après validation du build et des contrôles de sécurité,
# la CI met à jour le tag de l'image dans le dépôt GitOps.
#
# Le tag correspond au SHA court du commit :
#
#   tag: "ddbed5bf"
#          ↓
#   tag: "<nouveau SHA>"
#
# ArgoCD détecte ensuite le changement GitOps et synchronise
# Kubernetes avec la nouvelle version.
# ============================================================

update-gitops-tag:
  stage: gitops

  image: alpine:3.22

  tags:
    - kubernetes

  # Empêche deux pipelines de modifier simultanément
  # le dépôt GitOps.
  resource_group: shopsphere-gitops-update

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "src/**/*"
    - when: never

  script:
    - |
      set -eu

      echo "Installation de Git"
      apk add --no-cache git ca-certificates

      # Vérification du token utilisé pour accéder au dépôt GitOps
      if [ -z "${GITOPS_TOKEN:-}" ]; then
        echo "La variable GITOPS_TOKEN est absente"
        exit 1
      fi

      # Utilisation de l'autorité de certification interne
      export GIT_SSL_CAINFO="${CI_SERVER_TLS_CA_FILE}"

      git config --global http.sslCAInfo \
        "${CI_SERVER_TLS_CA_FILE}"

      # Identité utilisée pour le commit automatique GitOps
      git config --global user.name \
        "ShopSphere GitLab CI"

      git config --global user.email \
        "shopsphere-ci@platform.home.arpa"

      echo "Clonage du dépôt GitOps"

      git clone \
        --branch main \
        --single-branch \
        "https://oauth2:${GITOPS_TOKEN}@gitlab.platform.home.arpa/shpshore/shopsphere-gitops.git" \
        shopsphere-gitops

      cd shopsphere-gitops

      VALUES_FILE="charts/shopsphere/values.yaml"

      # Vérification de l'existence du values.yaml
      if [ ! -f "${VALUES_FILE}" ]; then
        echo "Fichier GitOps introuvable : ${VALUES_FILE}"
        exit 1
      fi

      # Vérification qu'une seule ligne tag existe
      TAG_COUNT="$(
        grep -cE '^[[:space:]]*tag:' "${VALUES_FILE}"
      )"

      if [ "${TAG_COUNT}" -ne 1 ]; then
        echo "Nombre inattendu de lignes tag : ${TAG_COUNT}"
        exit 1
      fi

      echo "Nouveau tag : ${CI_COMMIT_SHORT_SHA}"

      # Remplacement de l'ancien tag par le SHA du nouveau commit
      sed -i -E \
        "s/^([[:space:]]*tag:).*/\1 \"${CI_COMMIT_SHORT_SHA}\"/" \
        "${VALUES_FILE}"

      grep -nE \
        '^[[:space:]]*(repository|tag):' \
        "${VALUES_FILE}"

      # Si le tag est déjà présent, aucune modification nécessaire
      if git diff --quiet -- "${VALUES_FILE}"; then
        echo "Le dépôt GitOps contient déjà ce tag"
        exit 0
      fi

      # Commit automatique de la nouvelle version
      git add "${VALUES_FILE}"

      git commit -m \
        "Deploy ShopSphere ${CI_COMMIT_SHORT_SHA} [skip ci]"

      # Push vers le dépôt GitOps
      git push origin main

      echo "Tag GitOps mis à jour avec succès"
