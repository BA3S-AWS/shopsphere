stages:
  - verify
  - build

runner-smoke-test:
  stage: verify
  image: alpine:3.22
  tags:
    - kubernetes
  script:
    - echo "Runner Kubernetes ShopShore opérationnel"
    - echo "Projet=$CI_PROJECT_PATH"
    - echo "Branche=$CI_COMMIT_BRANCH"
    - echo "Commit=$CI_COMMIT_SHORT_SHA"
    - uname -a
    - test -f README.md
    - test -f docker-compose.yml
    - find src -mindepth 1 -maxdepth 1 -type d | sort
    - echo "Validation initiale réussie"

build-accounting:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - kubernetes
  script:
    - mkdir -p /kaniko/.docker
    - AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/src/accounting"
      --dockerfile "${CI_PROJECT_DIR}/src/accounting/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/accounting:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/accounting:latest"
      --registry-certificate "${CI_REGISTRY}=${CI_SERVER_TLS_CA_FILE}"
