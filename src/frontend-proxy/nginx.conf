server {
    listen 8080;

    # En-têtes de sécurité HTTP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Frontend
    location / {
        proxy_pass http://frontend:8080;
    }

    # Product Catalog
    location /api/products {
        proxy_pass http://product-catalog:8080/products;
    }

    # Cart
    location /api/cart/ {
        rewrite ^/api/cart/(.*)$ /cart/$1 break;
        proxy_pass http://cart:8080;
    }

    # Checkout
    location = /api/checkout {
        proxy_pass http://checkout:8080/checkout;
    }
}

