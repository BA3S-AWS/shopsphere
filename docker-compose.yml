name: shopshore
services:
  percona:
    image: percona/percona-server:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shopshore
      MYSQL_USER: shopshore
      MYSQL_PASSWORD: shopshore
    ports:
      - "3306:3306"
    volumes:
      - percona-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  product-catalog:
    image: ${REGISTRY}/shopsphere-product-catalog:latest
    build:
      context: ./src/product-catalog
      cache_from:
        - ${REGISTRY}/shopsphere-product-catalog:latest
    environment:
      DB_HOST: percona
      DB_PORT: 3306
      DB_USER: shopshore
      DB_PASSWORD: shopshore
      DB_NAME: shopshore
    depends_on:
       percona:
         condition: service_healthy
  cart:
    image: ${REGISTRY}/shopsphere-cart:latest
    build:
      context: ./src/cart
      cache_from:
        - ${REGISTRY}/shopsphere-cart:latest
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
    depends_on:
      - valkey

  payment:
    image: ${REGISTRY}/shopsphere-payment:latest
    build:
      context: ./src/payment
      cache_from:
        - ${REGISTRY}/shopsphere-payment:latest

  shipping:
    image: ${REGISTRY}/shopsphere-shipping:latest
    build:
      context: ./src/shipping
      cache_from:
        - ${REGISTRY}/shopsphere-shipping:latest

  fraud-detection:
    image: ${REGISTRY}/shopsphere-fraud-detection:latest
    build:
      context: ./src/fraud-detection
      cache_from:
        - ${REGISTRY}/shopsphere-fraud-detection:latest

  checkout:
    image: ${REGISTRY}/shopsphere-checkout:latest
    build:
      context: ./src/checkout
      cache_from:
        - ${REGISTRY}/shopsphere-checkout:latest
    environment:
      CART_URL: http://cart:8080
      PRODUCT_CATALOG_URL: http://product-catalog:8080
      PAYMENT_URL: http://payment:8080
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: orders
      SHIPPING_URL: http://shipping:8080
      FRAUD_URL: http://fraud-detection:8080
    depends_on:
      - cart
      - product-catalog
      - payment
      - kafka
      - shipping
      - fraud-detection

  accounting:
    image: ${REGISTRY}/shopsphere-accounting:latest
    build:
      context: ./src/accounting
      cache_from:
        - ${REGISTRY}/shopsphere-accounting:latest
    environment:
      DB_HOST: percona
      DB_PORT: 3306
      DB_USER: shopshore
      DB_PASSWORD: shopshore
      DB_NAME: shopshore
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: orders
    depends_on:
      percona:
        condition: service_healthy
      kafka:
        condition: service_started

  frontend:
    image: ${REGISTRY}/shopsphere-frontend:latest
    build:
      context: ./src/frontend
      cache_from:
        - ${REGISTRY}/shopsphere-frontend:latest
    depends_on:
      - product-catalog
      - cart
      - checkout

  frontend-proxy:
    image: ${REGISTRY}/shopsphere-frontend-proxy:latest
    build:
      context: ./src/frontend-proxy
      cache_from:
        - ${REGISTRY}/shopsphere-frontend-proxy:latest
    ports:
      - "8080:8080"
    depends_on:
      - frontend
      - product-catalog
      - cart
      - checkout

volumes:
  percona-data:
